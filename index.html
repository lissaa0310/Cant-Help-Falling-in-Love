<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>uma coisinha pra você ♡</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fff1f6;
            color: #704457;

            font-family: Georgia, serif;
            text-align: center;
        }

        .inicio {
            padding: 30px;
        }

        .decoracao {
            font-size: 28px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 35px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        .subtitulo {
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            border-radius: 30px;

            padding: 14px 30px;

            background: #e7a5bb;
            color: white;

            font-size: 17px;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <main class="inicio">

        <p class="decoracao">♡ ⋆｡°✩</p>

        <h1>uma coisinha pra você...</h1>

        <p class="subtitulo">
            fiz isso pensando em você ♡
        </p>

        <button onclick="abrirSite()">
            abrir 💗
        </button>

    </main>

    <script>
        function abrirSite() {
            alert("prepare-se hehe ♡");
        }
    </script>

</body>

</html>
